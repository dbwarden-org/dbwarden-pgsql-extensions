name: tests

on:
  push:
  pull_request:
  # Callable so the release pipeline can gate publishing on this exact suite
  # instead of keeping a second copy of it that drifts.
  workflow_call:
    inputs:
      ref:
        # The release path needs to test the tag being published, not whatever
        # branch the run was started from. Empty on push/pull_request.
        description: "Ref to check out and test. Defaults to the triggering ref."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12.7", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov --cov-branch --cov-report=xml
